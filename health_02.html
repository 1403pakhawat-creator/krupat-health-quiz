<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ข้อสอบวิชาเอกสุขศึกษา ชุดที่ 2 (50 ข้อ)</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#1f2933;--mute:#617080;--line:#d9e2e0;--main:#e91e78;--main-d:#c4155f;--navy:#0b1f4b;--ok:#1b8a3a;--okbg:#e6f6ea;--bad:#c0392b;--badbg:#fdecea;--tip:#fff7e0;--chip:#eaf0fb}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--card:#1c2522;--ink:#e8efec;--mute:#9bacaa;--line:#31403c;--main:#ff4d94;--main-d:#e63a82;--navy:#8fb0ff;--ok:#58d17a;--okbg:#17321f;--bad:#ff8a7a;--badbg:#3a1d19;--tip:#3a331a;--chip:#1d2a44}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun',system-ui,sans-serif;font-size:18px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mute);margin:0 0 12px}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;background:var(--main);color:#fff;cursor:pointer}
.btn:hover{background:var(--main-d)}
.band{height:14px;background:#0b1f4b}
.logo{display:block;margin:0 auto 10px;height:90px}
.icons{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin:8px 0 14px}
.icons img{height:46px;width:auto}
.sec img{height:18px;width:auto;vertical-align:-3px;margin-right:6px}
h1{color:var(--navy)}
.cover{text-align:center}
.coverimg{display:block;margin:0 auto 12px;max-height:340px;max-width:100%;border-radius:12px;box-shadow:0 8px 20px rgba(0,0,0,.28)}
.lbtop{font-size:.85rem;color:var(--mute);margin:0 0 8px}
.lbrow{display:flex;gap:8px;margin:8px 0}
.lbrow input{flex:1;font:inherit;padding:10px 12px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--ink);min-width:0}
.k{display:inline-block;min-width:1.4em;text-align:center;font-size:.8rem;font-weight:700;color:var(--mute);border:1px solid var(--line);border-radius:6px;margin-right:8px;padding:0 4px}
.kbd{text-align:center;color:var(--mute);font-size:.85rem;margin:6px 0 0}
.kbd b{color:var(--ink)}
@media (hover:none){.kbd{display:none}}
.note{margin-top:8px;font-size:.9rem;color:var(--mute)}
.report{display:block;margin:10px auto 0;background:none;border:0;color:var(--mute);font:inherit;font-size:.9rem;text-decoration:underline;cursor:pointer}
.sb{margin:10px 0}.sbt{display:flex;justify-content:space-between;font-size:.95rem;margin-bottom:4px}
.weak{margin:10px 0 0}
.hero{background:linear-gradient(135deg,#0b1f4b,#1d3f8f);border-radius:14px;padding:22px 14px 16px;margin:-6px -6px 14px;color:#fff}
.hero .em{font-size:84px;line-height:1.1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.35))}
.hero .chip{display:inline-block;background:#e91e78;color:#fff;font-weight:700;font-size:.9rem;border-radius:99px;padding:2px 14px;margin-top:6px}
.hero h1{color:#fff;margin:8px 0 2px}
.hero .sub{color:#cfd9f5;margin:0}
.stats{display:flex;justify-content:center;gap:10px;margin:0 0 14px}
.stats div{flex:1;background:var(--chip);border-radius:12px;padding:8px 4px}
.stats b{display:block;font-size:1.3rem;color:var(--navy)}
.stats small{color:var(--mute)}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:.9rem;margin-bottom:6px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--navy);transition:width .3s}
.sec{display:inline-block;background:var(--chip,#eef2fb);color:var(--navy);font-size:.85rem;font-weight:600;border-radius:99px;padding:2px 10px;margin-bottom:8px}
.q{font-weight:700;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--main)}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--ok);background:var(--okbg)}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}
.fb{border-radius:12px;padding:14px;margin:6px 0 14px}
.fb.ok{background:var(--okbg);border-left:5px solid var(--ok)}
.fb.no{background:var(--badbg);border-left:5px solid var(--bad)}
.fb b.h{display:block;font-size:1.1rem;margin-bottom:4px}
.tip{background:var(--tip);border-radius:10px;padding:8px 12px;margin-top:8px}
.score{font-size:3rem;font-weight:700;color:var(--navy);text-align:center;margin:6px 0}
.rev{border-top:1px solid var(--line);padding:12px 0}
.rev small{color:var(--mute)}
.hide{display:none}
.home{display:inline-block;color:var(--mute);text-decoration:none;font-size:.9rem;margin-bottom:10px}
.home:hover{color:var(--main)}

/* ผู้ทำสูงสุดของชุด: ทองให้เกียรติ */
.top,.lbtop{--g1:#8a5a00;--g2:#c98a00}
@media (prefers-color-scheme:dark){.top,.lbtop{--g1:#ffd740;--g2:#ffeb99}}
.top:not(:empty),.lbtop:not(:empty){display:inline-block;font-size:.85rem;font-weight:600;color:var(--g1);
  background:linear-gradient(90deg,rgba(255,215,64,.22),rgba(255,215,64,.06));border:1px solid rgba(201,138,0,.55);
  border-radius:99px;padding:2px 12px;margin:2px 0 6px;box-shadow:0 0 10px rgba(255,200,40,.28)}
.top b,.lbtop b{background:linear-gradient(90deg,var(--g1),var(--g2),var(--g1));background-size:200% 100%;-webkit-background-clip:text;background-clip:text;
  color:transparent;-webkit-text-fill-color:transparent;animation:goldmove 3s linear infinite}
@keyframes goldmove{to{background-position:200% 0}}
@media (prefers-reduced-motion:reduce){.top b,.lbtop b{animation:none}}

/* โลโก้ครูพัด: วงกลมตัดขอบทอง */
img.logo{border-radius:50%;border:5px solid transparent;aspect-ratio:1/1;width:auto;object-fit:cover;
  background:linear-gradient(#fff,#fff) padding-box,conic-gradient(from 0deg,#8a6a12,#ffe58a,#c9951c,#fff3b0,#b8860b,#ffe58a,#8a6a12) border-box;
  box-shadow:0 0 0 2px rgba(255,215,64,.35),0 6px 22px rgba(201,149,28,.55);animation:ringglow 2.8s ease-in-out infinite}
@keyframes ringglow{0%,100%{box-shadow:0 0 0 2px rgba(255,215,64,.3),0 6px 16px rgba(201,149,28,.4)}50%{box-shadow:0 0 0 3px rgba(255,229,138,.6),0 8px 30px rgba(255,200,40,.8)}}
@media (prefers-reduced-motion:reduce){img.logo{animation:none}}

/* โลโก้แบรนด์ (หัวข้อ) */
.duo{display:flex;justify-content:center;align-items:flex-start;gap:10px;margin:4px auto 10px}
.duo .lg{display:flex;flex-direction:column;align-items:center;gap:6px;max-width:46%}
.duo .logo{margin:0;height:84px}
.duo .nm{font-weight:700;font-size:.95rem;line-height:1.25;text-align:center;color:var(--navy)}
.duo .x{align-self:center;font-size:1.6rem;font-weight:700;color:#c98a00;margin-top:-18px}
@media (min-width:600px){.duo{gap:22px}.duo .logo{height:110px}.duo .nm{font-size:1.05rem}}
</style>
</head>

const IMG = {};

const pic = (k,c) => IMG[k] ? `<img class="${c||''}" src="${IMG[k]}" alt="">` : '';

const app = document.getElementById('app');

const BOOK_KEY = 'sukha_wrong_v1', SCORE_KEY = 'sukha_scores_v1';

const wr = (k, v) => { if (window.KQ_GUEST) return; try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

const LB = CONF.leaderboard_url || '';

const getName = () => { try { return localStorage.getItem('sukha_name') || ''; } catch (e) { return ''; } };
const setName = n => { try { localStorage.setItem('sukha_name', n); } catch (e) {} };

let ITEMS = [], i = 0, score = 0, answers = [];
const uid = q => q.uid || (DATA.id + ':' + q.no);

function start(){
  i = 0; score = 0; answers = [];
  ITEMS = DATA.review ? Object.values(rd(BOOK_KEY)) : DATA.items;
  if (DATA.review && !ITEMS.length) {
    app.innerHTML = `<div class="card cover"><h1>📒 สมุดข้อที่ผิด</h1>
      <p>ยังไม่มีข้อที่ผิดเลย เยี่ยมมาก! 🎉 ไปทำข้อสอบชุดอื่นก่อน ข้อที่ตอบผิดจะมารวมอยู่ที่นี่</p>
      <a class="btn" style="text-decoration:none;text-align:center" href="index.html">กลับหน้าแรก</a></div>`;
    return;
  }
  const n = ITEMS.length;
  app.innerHTML = `<div class="card cover">
    ${DATA.emoji ? `<div class="hero" style="background:linear-gradient(135deg,${DATA.c1||'#0b1f4b'},${DATA.c2||'#1d3f8f'})"><div class="em">${DATA.emoji}</div><h1>${esc(DATA.title)}</h1><p class="sub">${esc(DATA.subtitle)}</p><span class="chip">${esc(DATA.badge || '')}</span></div>
    <div class="stats"><div><b>${n}</b><small>ข้อ</small></div><div><b>4</b><small>ตัวเลือก</small></div><div><b>ทันที</b><small>เห็นเฉลย</small></div></div>
    ${duo()}` : `${DATA.coverimg ? `<img class="coverimg" src="${DATA.coverimg}" alt="">` : ''}${duo()}

    <p class="lbtop" id="lbtop"></p>
    <p>${esc(DATA.note)}</p>
    <button class="btn" id="go">เริ่มทำข้อสอบ (${n} ข้อ)</button>
    ${DATA.review ? '' : `<a href="pdf/${location.pathname.split('/').pop().replace(/\.html$/,'')}.pdf" download style="display:block;text-align:center;margin-top:10px;font-weight:700;color:#0f4c5c">📄 ดาวน์โหลดชุดนี้เป็น PDF (พร้อมเฉลย)</a>`}
    <p class="kbd">⌨️ กด <b>Enter</b> เพื่อเริ่ม • ตอบด้วยปุ่ม <b>1 2 3 4</b> (= ก ข ค ง)</p></div>`;
  document.getElementById('go').onclick = show;
  if (LB && !DATA.review && !window.KQ_GUEST) lbGet().then(d => { const s = d && d.sets && d.sets[DATA.id]; const el = document.getElementById('lbtop');
    if (s && el) el.innerHTML = `👑 คะแนนสูงสุดชุดนี้: <b>${esc(s.name)}</b> ${s.score}/${s.total}`; });
}

function show(){
  const q = ITEMS[i], n = ITEMS.length;
  const sec = q.sec || (DATA.sections || {})[q.dom] || '';
  const emo = q.emoji || DATA.emoji || '';
  app.innerHTML = `<div class="top"><span>ข้อ ${i+1} / ${n}</span><span>คะแนน ${score}</span></div>
    <div class="bar"><i style="width:${(i/n)*100}%"></i></div>
    <div class="card">
      <span class="sec">${emo ? emo + ' ' : ''}${DATA.review ? '' : pic((DATA.section_icons||{})[q.dom])}${esc(sec)}</span>
      <p class="q">${DATA.review ? '' : 'ข้อ ' + q.no + '. '}${esc(q.stem)}</p>
      <div id="opts">${q.opts.map((t,k)=>`<button class="opt" data-k="${k}"><span class="k">${k+1}</span>${L[k]}. ${esc(t)}</button>`).join('')}</div>
      <div id="fb"></div>
      <button class="btn hide" id="next"></button>
      ${CONF.report_url ? `<button class="report hide" id="rep">⚠️ แจ้งเฉลย/โจทย์ผิดข้อนี้</button>` : ''}
    </div>
    <p class="kbd">⌨️ คีย์ลัด: กด <b>1 2 3 4</b> = ตอบ ก ข ค ง &nbsp;•&nbsp; <b>Enter</b> หรือ <b>Space</b> = ข้อต่อไป</p>`;
  document.querySelectorAll('.opt').forEach(b => b.onclick = () => pick(+b.dataset.k));
}

function pick(k){
  const q = ITEMS[i], right = k === q.ans, id = uid(q);
  if (right) score++;
  answers.push({q, picked:k, right});
  // สมุดข้อที่ผิด: ผิด = จดไว้ / ถูก = เอาออก (จำได้แล้ว)
  const book = rd(BOOK_KEY);
  if (right) delete book[id];
  else book[id] = {uid:id, stem:q.stem, opts:q.opts, ans:q.ans, expl:q.expl||'', mn:q.mn||'',
                   dom:q.dom, sec:q.sec || (DATA.sections||{})[q.dom] || '', emoji:q.emoji || DATA.emoji || '', set:q.set || DATA.title, no:q.no};
  wr(BOOK_KEY, book);
  document.querySelectorAll('.opt').forEach(b => {
    const j = +b.dataset.k; b.disabled = true;
    if (j === q.ans) b.classList.add('right');
    else if (j === k) b.classList.add('wrong');
  });
  document.getElementById('fb').innerHTML = `<div class="fb ${right?'ok':'no'}">
    <b class="h">${right ? '✅ ถูกต้อง!' : '❌ ยังไม่ถูก'}</b>
    <div>เฉลย: ${L[q.ans]}. ${esc(q.opts[q.ans])}</div>
    ${q.expl ? `<div style="margin-top:6px">${esc(q.expl)}</div>` : ''}
    ${q.mn ? `<div class="tip">💡 สูตรจำ: ${esc(q.mn)}</div>` : ''}
    ${right ? '' : '<div class="note">📒 จดลงสมุดข้อที่ผิดให้แล้ว</div>'}</div>`;
  const nx = document.getElementById('next');
  nx.textContent = i === ITEMS.length-1 ? 'ดูคะแนนรวม' : 'ข้อต่อไป';
  nx.classList.remove('hide');
  nx.onclick = () => { if (++i < ITEMS.length) show(); else finish(); };
  const rep = document.getElementById('rep');
  if (rep) { rep.classList.remove('hide'); rep.onclick = () => report(q); }
  nx.scrollIntoView({block:'nearest', behavior:'smooth'});
}

function report(q){
  const txt = `[แจ้งเฉลย/โจทย์ผิด] ${q.set || DATA.title} ข้อ ${q.no}: ${q.stem}`;
  try { navigator.clipboard.writeText(txt); } catch (e) {}
  alert('คัดลอกข้อความแจ้งแล้ว กดวางส่งในหน้าถัดไปได้เลยค่ะ\n\n' + txt);
  window.open(CONF.report_url, '_blank');
}

function finish(){
  const n = ITEMS.length, pct = Math.round(score/n*100);
  const wrong = answers.filter(a => !a.right);
  const msg = pct>=80 ? 'เยี่ยมมาก! 🎉' : pct>=60 ? 'ดีเลย อีกนิดเดียว 💪' : 'ลองทบทวนแล้วทำอีกรอบนะ 📖';
  if (!DATA.review) {
    const sc = rd(SCORE_KEY), old = sc[DATA.id] || {best:0, tries:0};
    sc[DATA.id] = {best: Math.max(old.best, score), last: score, total: n, tries: old.tries + 1};
    wr(SCORE_KEY, sc);
  }
  // คะแนนแยกหมวด (เฉพาะชุดที่มีหลายหมวด)
  const by = {};
  answers.forEach(a => { const s = a.q.sec || (DATA.sections||{})[a.q.dom] || ''; (by[s] = by[s] || {r:0, t:0}); by[s].t++; if (a.right) by[s].r++; });
  const rows = Object.entries(by).sort((x, y) => x[1].r/x[1].t - y[1].r/y[1].t);
  const secHtml = rows.length > 1 ? `<div class="card"><h1>คะแนนแยกหมวด</h1>
    ${rows.map(([s, v]) => { const p = Math.round(v.r/v.t*100);
      return `<div class="sb"><div class="sbt"><span>${esc(s)}</span><b>${v.r}/${v.t} (${p}%)</b></div><div class="bar"><i style="width:${p}%"></i></div></div>`; }).join('')}
    ${rows[0][1].r/rows[0][1].t < 0.7 ? `<p class="weak">📌 จุดอ่อนของคุณ: <b>${esc(rows[0][0])}</b> ควรทบทวนหมวดนี้ก่อน</p>` : '<p class="weak">ทุกหมวดอยู่ในเกณฑ์ดี 👍</p>'}</div>` : '';
  const nb = Object.keys(rd(BOOK_KEY)).length;
  app.innerHTML = `<div class="card"><h1>สรุปผล</h1>
    <div class="score">${score} / ${n}</div>
    <p style="text-align:center">${pct}% — ${msg}</p>
    ${DATA.review ? '' : `<a class="btn" style="text-decoration:none;text-align:center;margin-bottom:10px;background:#0f4c5c;display:block" href="pdf/${location.pathname.split('/').pop().replace(/\.html$/,'')}.pdf" download>📄 ดาวน์โหลดชุดข้อสอบนี้ + เฉลย (PDF)</a>`}
    ${DATA.review ? '' : `<a class="btn" style="text-decoration:none;text-align:center;margin-bottom:10px;display:${nb ? 'block' : 'none'}" href="review.html">📒 ทบทวนสมุดข้อที่ผิด (${nb} ข้อ)</a>`}
    <button class="btn ${DATA.review && !nb ? 'hide' : ''}" id="again">${DATA.review ? 'ทบทวนข้อที่ยังผิดอีกรอบ' : 'ทำใหม่อีกครั้ง'}</button></div>
    ${LB && !DATA.review && !window.KQ_GUEST ? `<div class="card" id="lbcard"><h1>🏆 ขึ้นอันดับ</h1>
      <p class="sub">ใส่ชื่อเล่นเพื่อบันทึกคะแนนขึ้นอันดับ (ไม่บังคับ ชื่อจะแสดงให้ทุกคนเห็น)</p>
      <div class="lbrow"><input id="lbname" maxlength="20" placeholder="ชื่อเล่น (ไม่เกิน 20 ตัวอักษร)" value="${esc(getName())}"><button class="btn" id="lbsend" style="width:auto;padding:10px 18px">ส่งคะแนน</button></div>
      <p id="lbmsg" class="sub"></p></div>` : ''}
    ${secHtml}
    <div class="card"><h1>ข้อที่ควรทบทวน (${wrong.length})</h1>
    ${wrong.length ? wrong.map(a => { const q = a.q;
      return `<div class="rev"><b>${DATA.review ? '' : 'ข้อ ' + q.no + '. '}${esc(q.stem)}</b><br>
        <small>คุณตอบ: ${L[a.picked]}. ${esc(q.opts[a.picked])}</small><br>
        <span style="color:var(--ok)">เฉลย: ${L[q.ans]}. ${esc(q.opts[q.ans])}</span>
        ${q.expl ? `<br><small>${esc(q.expl)}</small>` : ''}${q.mn ? `<div class="tip">💡 ${esc(q.mn)}</div>` : ''}</div>`;
    }).join('') : '<p>ถูกครบทุกข้อ ไม่มีข้อที่ต้องทบทวน 🎉</p>'}</div>`;
  const ag = document.getElementById('again'); if (ag) ag.onclick = start;
  const sb = document.getElementById('lbsend');
  if (sb) {
    const send = () => {
      const name = document.getElementById('lbname').value.trim().slice(0, 20); if (!name) { document.getElementById('lbmsg').textContent = 'ใส่ชื่อก่อนนะคะ'; return; }
      setName(name); sb.disabled = true; document.getElementById('lbmsg').textContent = 'กำลังส่ง...';
      fetch(LB, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain'}, body: JSON.stringify({pid:pidv, name, set:DATA.id, score, total:n})})
        .then(() => new Promise(r => setTimeout(r, 1200))).then(() => lbGet(DATA.id)).then(d => {
          const m = d && d.me, el = document.getElementById('lbmsg');
          el.innerHTML = m && m.setRank ? `✅ บันทึกแล้ว! อันดับในชุดนี้ <b>#${m.setRank}</b> จาก ${m.setPlayers} คน • อันดับรวม <b>#${m.overallRank}</b> (${m.points} คะแนนรวม)` : '✅ ส่งคะแนนแล้ว';
        }).catch(() => { document.getElementById('lbmsg').textContent = 'ส่งไม่สำเร็จ ลองใหม่อีกครั้ง'; sb.disabled = false; });
    };
    sb.onclick = send;
    document.getElementById('lbname').addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
  }
  window.scrollTo(0,0);
}
// คีย์ลัด: 1-4 = ตอบ (ก-ง), Enter/Space/→ = ไปต่อ / เริ่ม / ทำใหม่
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
  const t = e.target; if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return;
  const vis = el => el && !el.classList.contains('hide');
  if (/^[1-4]$/.test(e.key)) {
    const b = document.querySelector('.opt[data-k="' + (+e.key - 1) + '"]');
    if (b && !b.disabled) { e.preventDefault(); b.click(); }
    return;
  }
  if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') {
    const el = [document.getElementById('next'), document.getElementById('go'), document.getElementById('again')].find(vis);
    if (el) { e.preventDefault(); if (document.activeElement) document.activeElement.blur(); el.click(); }
  }
});
document.addEventListener('keyup', e => { if (e.key === ' ') e.preventDefault(); });
start();
</script>
</body>
</html>
